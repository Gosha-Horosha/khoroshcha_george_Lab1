[project]
name = "lab-1-khoroshcha"
version = "0.1.0"
description = "Лабораторная 1: кто снизил активность по картам и почему"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "playwright>=1.64.1",
    "pyarrow>=26.0.0",
    "seaborn>=0.13.2",
]

[tool.uv]
package = false    # проект — ноутбуки, а не пакет: uv sync только ставит зависимости
